<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Info</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        .user-card {
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1>User Profile</h1>
                
                <!-- Alert for flash messages -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- User Info Card -->
                <div class="user-card">
                    <div>
                        <h4>Welcome, <span th:text="${user.name}">User Name</span></h4>
                        <p>Email: <span th:text="${user.email}">email@example.com</span></p>
                    </div>
                </div>
                
                <!-- Navigation Options -->
                <div class="mt-4">
                    <a href="/contacts" class="btn btn-primary">View Contacts</a>
                    <a href="/logout" class="btn btn-outline-danger ms-2">Logout</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
